spring:
  datasource:
    name: social_education_admin
    url: jdbc:postgresql://pg-invest-education-admin-qa.m1.invest.cloud:5432/invest_education_admin?ApplicationName=${spring.application.name}
    driverClassName: org.postgresql.Driver
    username: liquibase
    password: liquibase
    hikari:
      pool_name: social_education_admin
      maximum-pool-size: 1
      max-lifetime: 3600000
      connection-test-query: SELECT 1

server:
  port: 8080

apple:
  id: 0
  name: green

logging:
  level:
    org.springframework: ERROR
    io.app: TRACE
  file:
    path: /logs

kafka:
  group-id: education.s-b-markov
  education:
    bootstrap-servers: ds-qa-invest-kafka-1.ds.invest.cloud:9093,ds-qa-invest-kafka-2.ds.invest.cloud:9093,ds-qa-invest-kafka-3.ds.invest.cloud:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        request.timeout.ms: 10000
        security:
          protocol: SASL_PLAINTEXT
        sasl:
          mechanism: SCRAM-SHA-512
          jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="education" password="0z:,*>d#610>";
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ru.smarkov.demo.configuration.kafka.CourseDeserializer
      group-id: education.test.consumer
      properties:
        spring.json.trusted.packages: "*"
        request.timeout.ms: 10000
        security:
          protocol: SASL_PLAINTEXT
        sasl:
          mechanism: SCRAM-SHA-512
          jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="education" password="0z:,*>d#610>";
